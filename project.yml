# XcodeGen manifest. This file is the source of truth for the Xcode project;
# Bias.xcodeproj is generated in CI and gitignored, because this machine cannot run Xcode.
#
#   brew install xcodegen && xcodegen generate

name: Bias

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

packages:
  BiasCore:
    path: .

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  BiasApp:
    type: application
    platform: iOS
    sources:
      - path: BiasApp
        excludes:
          - Info.plist
      - path: Shared
      - path: data/quotes.json
        buildPhase: resources
    dependencies:
      - package: BiasCore
        product: BiasCore
      - target: BiasWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.bias
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Bias
    info:
      path: BiasApp/Info.plist
      properties:
        CFBundleDisplayName: Bias
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  BiasWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: BiasWidgets
        excludes:
          - Info.plist
      - path: Shared
      - path: data/quotes.json
        buildPhase: resources
    dependencies:
      - package: BiasCore
        product: BiasCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.bias.widgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: BiasWidgets/Info.plist
      properties:
        CFBundleDisplayName: Bias
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  BiasApp:
    build:
      targets:
        BiasApp: all
    run:
      config: Debug
    archive:
      config: Release
