name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on Linux, starts instantly, and catches most real mistakes.
  checks:
    name: logic + content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Core self-checks
        run: swift run quotelint self-check

      - name: Validate content
        # Development rules on purpose: data/quotes.json still holds the placeholder row, so a
        # shipping-mode lint must keep failing until real quotes replace it.
        run: swift run quotelint --mode development --min 1 --stats

      - name: quotes.json is up to date with the CSVs
        run: |
          swift run quotelint build --mode development --min 1 --out "$RUNNER_TEMP/quotes.generated.json" > /dev/null
          diff -u data/quotes.json "$RUNNER_TEMP/quotes.generated.json"

  # macOS runners are free but heavily contended. Anything that can run on Linux is kept out of
  # this job so a queue stall never hides a logic failure.
  build:
    name: ios build
    needs: checks
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app and widget
        # Unsigned on purpose: there is no Apple Developer account yet. This still proves the
        # SwiftUI and WidgetKit code compiles and links.
        run: |
          xcodebuild \
            -project Bias.xcodeproj \
            -scheme BiasApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      # There is no Mac here, so CI takes the pictures. Download them with:
      #   gh run download <run-id> -n screenshots
      - name: Screenshot the app and widget preview
        run: |
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator" \
            -maxdepth 1 -name "BiasApp.app" -print -quit)
          echo "app: $APP"

          UDID=$(xcrun simctl list devices available -j | python3 -c \
            "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for v in d.values() for x in v if x['name'].startswith('iPhone')))")
          echo "simulator: $UDID"

          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"

          mkdir -p artifacts
          xcrun simctl launch "$UDID" com.example.bias
          sleep 5
          xcrun simctl io "$UDID" screenshot artifacts/today.png

          xcrun simctl terminate "$UDID" com.example.bias || true
          xcrun simctl launch "$UDID" com.example.bias -widgetPreview YES
          sleep 5
          xcrun simctl io "$UDID" screenshot artifacts/widgets.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: artifacts/*.png
          if-no-files-found: warn
