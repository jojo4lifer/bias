name: CI

# This machine cannot build the app: macOS 12.7.6 caps Xcode at 14.2 (iOS 16.2 SDK) and the
# Command Line Tools are missing PackageDescription.swiftmodule, so SwiftPM cannot even run here.
# CI is therefore the compiler of record.
#
# What this proves on every push:
#   1. BiasCore logic checks pass
#   2. the quote database validates
#   3. data/quotes.json actually matches data/groups.csv + data/quotes.csv
#   4. the Xcode project generates and both targets compile

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Core self-checks
        run: swift run quotelint self-check

      - name: Validate content
        # Development rules on purpose: data/quotes.json still contains the placeholder row, and a
        # shipping-mode lint must keep failing until real quotes replace it.
        run: swift run quotelint --mode development --min 1 --stats

      - name: quotes.json is up to date with the CSVs
        run: |
          swift run quotelint build --mode development --min 1 --out "$RUNNER_TEMP/quotes.generated.json" > /dev/null
          diff -u data/quotes.json "$RUNNER_TEMP/quotes.generated.json"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app and widget
        # Unsigned on purpose: there is no Apple Developer account yet. This still proves the
        # SwiftUI and WidgetKit code compiles and links.
        run: |
          xcodebuild \
            -project Bias.xcodeproj \
            -scheme BiasApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
